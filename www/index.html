<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075e36">
  <title>Mai Ambato Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎵 Mai Ambato Player</h1>
    <p>Waƙoƙin Mai Ambato</p>
  </header>

  <main>
    <section class="player">
      <h2 id="songTitle">Zaɓi waƙa domin sauraro</h2>
      <audio id="audioPlayer" controls preload="metadata"></audio>
    </section>

    <section class="library">
      <h2>📀 Kundin Waƙoƙi</h2>
      <p id="songCount">Ana loda waƙoƙi...</p>
      <input
        type="search"
        id="searchSong"
        placeholder="🔎 Nemi waƙa..."
        aria-label="Nemi waƙa"
      >
      <ul id="songList"></ul>
      <p id="emptyMessage" hidden>Ba a sami waƙar da ka nema ba.</p>
    </section>
  </main>

  <footer>
    <p>© Mai Ambato Player</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
